<script>{{ math_assets().render|safe }}</script>
<script>
window.BIPOL_MATH_OPTIONS = {
  delimiters: [
    {left: '$$', right: '$$', display: true},
    {left: '\\[', right: '\\]', display: true},
    {left: '\\(', right: '\\)', display: false},
    {left: '$', right: '$', display: false}
  ],
  throwOnError: false,
  strict: 'ignore'
};
document.addEventListener('DOMContentLoaded', function () {
  renderMathInElement(document.body, window.BIPOL_MATH_OPTIONS);
});
</script>
