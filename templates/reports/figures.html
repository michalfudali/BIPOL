<script>
(() => {
  const res = {{ figure_results|tojson }};
  const chart = (id, options) => {
    const box = document.getElementById(id);
    if (box) box.innerHTML = BipolVisuals.chart(options);
  };
  const s=res.sizing, a=res.aerodynamics, e=res.envelope, g=res.geometry;
  const dp=s.design_point, jet=s.engine_type==='jet';
  const wsEnds=[s.ws_values[0],s.ws_values[s.ws_values.length-1]];
  chart('repMatching', {title:'Diagram doboru', xLabel:'W/S [N/m²]', yLabel:jet?'T/W [—]':'P/W [W/N]',
    series:[[s.takeoff_basis==='15m'?'Start na 15 m':'Rozbieg',s.curve_takeoff],['Wznoszenie',s.curve_climb],['Przelot',s.curve_cruise],
      ...(s.curve_vmax?[['Vmax przy ziemi',s.curve_vmax]]:[]),...(s.curve_tow?[['Holowanie szybowca',s.curve_tow]]:[])].map(([name,ys],i)=>({name,dash:i===1,data:s.ws_values.map((x,j)=>[x,ys[j]])}))
      .concat(s.climb_min==null?[]:[{name:'Minimum wznoszenia (8)',dash:true,data:wsEnds.map(x=>[x,s.climb_min])}]),
    vertical:[{x:s.ws_stall_max,label:'Vmin'},...(s.ws_landing==null?[]:[{x:s.ws_landing,label:'Lądowanie'}]),
      ...(s.ws_max_range==null?[]:[{x:s.ws_max_range,label:'Max zasięg'}])],
    points:[{x:dp.ws,y:jet?dp.tw:dp.pw,label:'Projekt'}]});
  chart('repPolar',{title:'Biegunowe aerodynamiczne',xLabel:'Cx [—]',yLabel:'Cz [—]',
    series:[['Gładka','cx_clean'],['Startowa','cx_to'],['Do lądowania','cx_lnd']].map(([name,key],i)=>({name,dash:i===1,data:a.polar_points.map(p=>[p[key],p.cz])}))});
  const wingRows=res.bipol_projects.p3.wing_alpha_table||[];
  chart('repWingAlpha',{title:'Płat: Cz(α) i Cm(α)',xLabel:'α [°]',yLabel:'Cz, Cm [—]',
    series:[{name:'Cz',data:wingRows.map(r=>[r.alpha_deg,r.cz])},{name:'Cm',dash:true,data:wingRows.map(r=>[r.alpha_deg,r.cm_le])}]});
  chart('repWingPolar',{title:'Płat: Cz(Cx)',xLabel:'Cx [—]',yLabel:'Cz [—]',series:[{name:'Płat',data:wingRows.map(r=>[r.cx,r.cz])}]});
  const cc=res.bipol_projects.p4.cg_characteristics;
  if (cc) {
    const ac=cc.alpha_table, pos=ac.filter(r=>r.cz>0), sp=cc.speed_polars;
    chart('repAcCzAlpha',{title:'Samolot: Cz(α)',xLabel:'α [°]',yLabel:'Cz [—]',series:[{name:'Cz',data:ac.map(r=>[r.alpha_deg,r.cz])}]});
    chart('repAcCmAlpha',{title:'Samolot: Cm(α)',xLabel:'α [°]',yLabel:'Cm [—]',
      series:[{name:'ŚC przedni',data:ac.map(r=>[r.alpha_deg,r.cm_fwd])},{name:'ŚC tylny',dash:true,data:ac.map(r=>[r.alpha_deg,r.cm_aft])}]});
    chart('repKAlpha',{title:'K(α)',xLabel:'α [°]',yLabel:'K [—]',series:[{name:'K',data:pos.map(r=>[r.alpha_deg,r.k])}]});
    chart('repKCz',{title:'K(Cz)',xLabel:'Cz [—]',yLabel:'K [—]',series:[{name:'K',data:pos.map(r=>[r.cz,r.k])}]});
    chart('repEAlpha',{title:'E(α)',xLabel:'α [°]',yLabel:'E [—]',series:[{name:'E',data:pos.map(r=>[r.alpha_deg,r.e])}]});
    chart('repECz',{title:'E(Cz)',xLabel:'Cz [—]',yLabel:'E [—]',series:[{name:'E',data:pos.map(r=>[r.cz,r.e])}]});
    chart('repSpeedPolarCg',{title:'Biegunowa prędkości',xLabel:'V [km/h]',yLabel:'w [m/s]',
      series:[['forward','ŚC przedni'],['aft','ŚC tylny']].map(([k,name],i)=>({name,dash:i===1,data:sp[k].points.filter(p=>p.v_kmh<=sp[k].v_opt_kmh*2.2).map(p=>[p.v_kmh,p.w_ms])})),
      points:[['forward','przód'],['aft','tył']].map(([k,label])=>({x:sp[k].v_ek_kmh,y:sp[k].w_min_ms,label:'V_ek '+label}))});
  }
  chart('repSchrenk',{title:'Rozkład Schrenka',xLabel:'y [m]',yLabel:'Cięciwa zastępcza [m]',
    series:[['Geometryczny','c_geom'],['Eliptyczny','c_ellip'],['Schrenka','c_schrenk']].map(([name,key],i)=>({name,dash:i===1,data:g.schrenk.map(p=>[p.y,p[key]])}))});
  chart('repClimb',{title:'Prędkość wznoszenia',xLabel:'V [km/h]',yLabel:'w_y [m/s]',
    series:[{name:'Poziom morza, ISA',data:res.performance.climb.climb_curve.map(p=>[p.v_kmh,p.wy_ms])}]});
  const glide=res.performance.glide;
  chart('repGlideChart',{title:'Biegunowa opadania',xLabel:'V TAS [km/h]',yLabel:'Opadanie [m/s]',
    series:[{name:'Równowaga sił',data:glide.points.filter(p=>p.v_kmh<=glide.best_glide.v_kmh*2.2).map(p=>[p.v_kmh,p.sink_ms])}],
    points:[{x:glide.minimum_sink.v_kmh,y:glide.minimum_sink.sink_ms,label:'Min. opadanie'}]});
  chart('repVn',{title:'Obwiednia obciążeń V–n',xLabel:'V [km/h]',yLabel:'n [—]',
    series:[{name:'Manewrowa',data:e.maneuver_polygon.map(p=>[p.v_kmh,p.n])},
      {name:'Podmuch dodatni',dash:true,data:e.gust_pos.map(p=>[p.v_kmh,p.n])},
      {name:'Podmuch ujemny',dash:true,data:e.gust_neg.map(p=>[p.v_kmh,p.n])},
      {name:'Klapy',data:res.bipol_projects.p6.flap_envelope_loop.map(p=>[p.v_kmh,p.n])}]});
})();
</script>
